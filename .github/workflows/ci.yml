# CI workflow for pixel-agents

name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Every check runs even when an earlier one failed (`!cancelled()`), so one
    # run reports all failures; any failed step still fails the job.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Validate AsyncAPI spec
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run asyncapi:validate

      - name: Generated messages drift check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run asyncapi:generate
          if ! git diff --exit-code core/src/messages.ts; then
            echo "::error::core/src/messages.ts is out of sync with core/asyncapi.yaml. Run 'npm run asyncapi:generate' locally and commit the result."
            exit 1
          fi

      - name: Type Check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check-types

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Format Check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Webview Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test -w webview-ui

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run build:extension
          npm run build:webview

      # Server tests spawn the bundled hook script (dist/hooks/claude-hook.js).
      - name: Server Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test -w server
