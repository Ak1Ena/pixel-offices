name: Publish Desktop App

# Builds the Electron app for macOS, Windows and Linux and uploads it to the
# GitHub release. The release assets (latest*.yml + installers) are the feed
# installed apps check for updates (adapters/electron/updater.ts).

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run package

      - name: Build and upload desktop app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing. Without these the app is unsigned: it runs, but
          # macOS will not install auto-updates for an unsigned app.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          # Manual runs build without publishing (a dry run of the release build).
          if [ "${{ github.event_name }}" = "release" ]; then PUBLISH=always; else PUBLISH=never; fi
          npx electron-builder --publish "$PUBLISH"
