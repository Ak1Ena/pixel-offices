# Desktop app (Electron shell around the standalone office).
# Build only:   npm run desktop:build      (installers in release/)
# Publish:      GH_TOKEN=… npm run desktop:release
#   Uploads to the GitHub release v<package.json version> — the feed installed
#   apps check for updates (adapters/electron/updater.ts). Bump package.json to
#   match the release tag first.
appId: com.ak1ena.pixeloffice
productName: Pixel Office
# The npm name (@ak1ena/pixel-office) is not a usable file name (Linux binary).
executableName: pixel-office
directories:
  output: release
  buildResources: build
extraMetadata:
  main: dist/electron.js
files:
  - dist/electron.js
  - dist/cli.js
  - dist/assets/**
  - dist/hooks/**
  - dist/webview/**
  - package.json
  - icon.png
# The shell runs dist/cli.js with the user's `node`, which can't read an asar
# archive, and node-pty must stay built for that Node, not Electron's.
asar: false
npmRebuild: false
publish:
  provider: github
  owner: Ak1Ena
  repo: pixel-offices
  releaseType: release
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip] # zip is what the updater downloads
win:
  target: nsis
nsis:
  oneClick: true
linux:
  target: AppImage
  category: Development
