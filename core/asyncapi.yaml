      additionalProperties: false
      required: [type, team, workflows]
      properties:
        type:
          const: importTeam
        team:
          $ref: '#/components/schemas/TeamPreset'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'

    DraftTeam:
      description: |
        Ask AI to draft a team preset (or change `previous` as `change` says).
        The answer comes back as teamDraft to this client only. Privileged —
        it spends tokens.
      type: object
      additionalProperties: false
      required: [type, requestId, description]
      properties:
        type:
          const: draftTeam
        requestId:
          type: string
        description:
          type: string
        folder:
          type: string
          description: Project the drafter may read (only with readProject).
        readProject:
          type: boolean
        previous:
          $ref: '#/components/schemas/TeamPreset'
        change:
          type: string

    DraftWorkflow:
      description: Ask AI to draft a workflow (or change `previous`). Answered as workflowDraft. Privileged.
      type: object
      additionalProperties: false
      required: [type, requestId, description]
      properties:
        type:
          const: draftWorkflow
        requestId:
          type: string
        description:
          type: string
        folder:
          type: string
        readProject:
          type: boolean
        previous:
          $ref: '#/components/schemas/Workflow'
        change:
          type: string

    Proposals:
      description: |
        Changes agents suggested to files (`pixel-office propose`), for the
        user to review before anything is written. Sent on each change and in
        the handshake. Hunk lines are shown in the office; the agent itself
        only ever sent paths.
      type: object
      additionalProperties: false
      required: [type, proposals]
      properties:
        type:
          const: proposals
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'

    Proposal:
      type: object
      additionalProperties: false
      required: [proposalId, path, state, hunks, createdAt]
      properties:
        proposalId:
          type: string
        path:
          type: string
        agentId:
          type: integer
        why:
          type: string
        state:
          $ref: '#/components/schemas/ProposalState'
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/ProposalHunk'
        createdAt:
          type: string
        note:
          type: string
          description: Why the last Apply did not go through, or what it did.
        canUndo:
          type: boolean

    ProposalState:
      type: string
      enum: [open, applied, discarded]

    ProposalHunk:
      type: object
      additionalProperties: false
      required: [hunkId, oldStart, newStart, lines, decision]
      properties:
        hunkId:
          type: string
        oldStart:
          type: integer
        newStart:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ProposalLine'
        decision:
          $ref: '#/components/schemas/HunkDecision'
        reason:
          type: string
        where:
          type: string
          description: 'For a document suggestion, the place this change is at ("¶12", "Sheet1!C5").'
        place:
          $ref: '#/components/schemas/DocPlaceRef'

    DocPlaceRef:
      description: |
        Where a document suggestion lands, so the viewer can show it in place:
        a Word paragraph (`para`), a new paragraph after one (`insertAfter`, 0 =
        before the first), a slide's text box (`slide` + `shape`), or a cell
        (`cell`, with `sheet` when named).
      type: object
      additionalProperties: false
      properties:
        para:
          type: integer
        insertAfter:
          type: integer
        slide:
          type: integer
        shape:
          type: string
        sheet:
          type: string
        cell:
          type: string

    ProposalLine:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          $ref: '#/components/schemas/ProposalLineKind'
        text:
          type: string

    ProposalLineKind:
      type: string
      enum: [context, del, add]

    HunkDecision:
      type: string
      enum: [pending, accepted, rejected]

    DecideHunk:
      description: Accept, reject or un-decide one change (hunkId "*" = all of them). Privileged.
      type: object
      additionalProperties: false
      required: [type, proposalId, hunkId, decision]
      properties:
        type:
          const: decideHunk
        proposalId:
          type: string
        hunkId:
          type: string
        decision:
          $ref: '#/components/schemas/HunkDecision'
        reason:
          type: string

    ApplyProposal:
      description: Write the accepted changes to the real file and tell the agent what landed. Privileged.
      type: object
      additionalProperties: false
      required: [type, proposalId]
      properties:
        type:
          const: applyProposal
        proposalId:
          type: string

    DiscardProposal:
      description: Drop a suggestion without writing anything; the agent is told. Privileged.
      type: object
      additionalProperties: false
      required: [type, proposalId]
      properties:
        type:
          const: discardProposal
        proposalId:
          type: string

    UndoProposal:
      description: Put back the file as it was before the last Apply of this suggestion. Privileged.
      type: object
      additionalProperties: false
      required: [type, proposalId]
      properties:
        type:
          const: undoProposal
        proposalId:
          type: string

    SaveBoardPin:
      description: Add a whiteboard pin, or replace the pin with the same id.
      type: object
      additionalProperties: false
      required: [type, pin]
      properties:
        type:
          const: saveBoardPin
        pin:
          $ref: '#/components/schemas/BoardPin'

    RemoveBoardPin:
      description: |
        Remove a whiteboard pin. With `deleteFile`, a file pin's file is deleted
        too — only when it is a copy the office stored itself (an upload in
        ~/.pixel-agents/files) and no other pin uses it; the user's own files
        are never deleted. Deleting needs a privileged connection.
      type: object
      additionalProperties: false
      required: [type, pinId]
      properties:
        type:
          const: removeBoardPin
        pinId:
          type: string
        deleteFile:
          type: boolean

    SaveDeskTask:
      description: |
        Add a card to the task desk, or edit the card with the same id.
        Privileged: a card is work an agent will spend tokens on. `folder` is
        any path on the server's machine; the server resolves it to the git
        root and branch the card is matched on. Title, body, kind and priority
        can be edited until an agent starts building; the folder only while the
        card is still in the inbox.
      type: object
      additionalProperties: false
      required: [type, kind, title, body, priority, folder]
      properties:
        type:
          const: saveDeskTask
        taskId:
          type: string
          description: Absent for a new card.
        kind:
          $ref: '#/components/schemas/DeskTaskKind'
        title:
          type: string
        body:
          type: string
        priority:
          $ref: '#/components/schemas/DeskTaskPriority'
        folder:
          type: string
        draft:
          type: boolean
          description: |
            New cards only: keep it as a draft. No agent looks at a draft until
            the human sends it to the desk (`deskTaskAction: publish`).
        teamId:
          type: string
          description: Team preset for the card ('' = none). Editable until an agent looks.
        workflowId:
          type: string
          description: Workflow whose steps the brief follows ('' = none). Editable until an agent looks.
        model:
          type: string
          description: Model picker label agents started for this card use ('' = the usual model). Editable until an agent looks.
        attachments:
          type: array
          description: Absolute file paths to attach (replaces the list). Editable until the build starts.
          items:
            type: string

    RemoveDeskTask:
      description: Remove a card from the task desk. Privileged.
      type: object
      additionalProperties: false
      required: [type, taskId]
      properties:
        type:
          const: removeDeskTask
        taskId:
          type: string

    DeskTaskAction:
      description: |
        The human's call on a card. Privileged. `publish` sends a draft to the
        desk. `verified`, `do` and `rejected`
        answer an agent's brief; `accept` and `sendBack` answer a finished
        result. `rejected` and `sendBack` need a `note`. `answers` are the
        replies to the brief's questions, by position. `subtasks` replaces the
        newest brief's subtask list (steps: title, kind, ref, skip).
      type: object
      additionalProperties: false
      required: [type, taskId, action]
      properties:
        type:
          const: deskTaskAction
        taskId:
          type: string
        action:
          $ref: '#/components/schemas/DeskHumanAction'
        note:
          type: string
        answers:
          type: array
          items:
            type: string
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/DeskSubtask'

    EditDeskSteps:
      description: |
        Replace a card's steps (the newest brief's subtasks): reorder, retype,
        change kinds, add, remove. Privileged. Allowed while the brief waits
        for the human and during the build; mid-build, the steps already done
        and the current one are locked and must come first, unchanged. The
        agent learns of the change on its next `task step` / `task gate`.
      type: object
      additionalProperties: false
      required: [type, taskId, steps]
      properties:
        type:
          const: editDeskSteps
        taskId:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/DeskSubtask'

    AnswerDeskGate:
      description: |
        The human's answer at a card's gate step (1-based `step`). `continue`
        marks it done and the agent goes on; `stop` tells the agent to stop
        the build and report what it has. Privileged.
      type: object
      additionalProperties: false
      required: [type, taskId, step, decision]
      properties:
        type:
          const: answerDeskGate
        taskId:
          type: string
        step:
          type: integer
        decision:
          $ref: '#/components/schemas/GateDecision'
        note:
          type: string

    SetDeskTaskAllow:
      description: |
        Which agents may take a card. Privileged. Empty = any agent working in
        the card's folder.
      type: object
      additionalProperties: false
      required: [type, taskId, allow]
      properties:
        type:
          const: setDeskTaskAllow
        taskId:
          type: string
        allow:
          type: array
          items:
            type: integer

    SetAgentPickup:
      description: |
        Whether an agent picks up cards from the task desk. Privileged.
        Persisted with the agent.
      type: object
      additionalProperties: false
      required: [type, id, enabled]
      properties:
        type:
          const: setAgentPickup
        id:
          type: integer
        enabled:
          type: boolean

    SetAgentLook:
      description: |
        Give an agent's character a look for the 3D office (character studio).
        No `look` clears it: the character goes back to its palette.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: setAgentLook
        id:
          type: integer
        look:
          $ref: '#/components/schemas/AgentLook'

    RenameAgent:
      description: Give an agent's character a name (empty string clears it).
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          const: renameAgent
        id:
          type: integer
        name:
          type: string

    StartAgent:
      description: |
        Start Claude in `cwd` as an agent the office runs itself (no terminal
        window; its chat card is the interface). Privileged: it starts a
        program on the machine. `command` is `claude` by default; it may be a
        shell alias or carry flags, but must run Claude.
      type: object
      additionalProperties: false
      required: [type, cwd]
      properties:
        type:
          const: startAgent
        cwd:
          type: string
        name:
          type: string
        command:
          type: string
        firstMessage:
          type: string
        skipPermissions:
          type: boolean
        resume:
          type: string
          description: A session id from `pastSessions`; the agent continues it (`claude --resume <id>`).
        model:
          type: string
          description: |
            A model label from `modelOptions`. The agent starts, the office
            picks the model in its picker (this session only), and only then
            types `firstMessage`.
        look:
          $ref: '#/components/schemas/AgentLook'
          description: The character's 3D look, applied once the session is adopted.

    SetAgentRelay:
      description: Turn agent-to-agent @mention passing on or off. Privileged.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAgentRelay
        enabled:
          type: boolean

    SendAgentKeys:
      description: |
        Press keys in the terminal of an agent the office runs itself, to
        answer an on-screen question. Privileged.
      type: object
      additionalProperties: false
      required: [type, id, keys]
      properties:
        type:
          const: sendAgentKeys
        id:
          type: integer
        keys:
          type: array
          items:
            $ref: '#/components/schemas/AgentKey'

    ClearAgentContext:
      description: |
        Clear an agent's context: type `/clear` (or `/compact`) into its
        terminal once its turn has ended. Nothing is typed after it. Reaches the
        same terminals office chat does (agentChatSendable). Privileged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: clearAgentContext
        id:
          type: integer
        mode:
          $ref: '#/components/schemas/ClearMode'

    ClearMode:
      type: string
      enum: [clear, compact]

    AnswerClearRequest:
      description: Allow or turn down an agent's request to clear its own context. Privileged.
      type: object
      additionalProperties: false
      required: [type, id, allow]
      properties:
        type:
          const: answerClearRequest
        id:
          type: integer
        allow:
          type: boolean

    SetAgentPrefs:
      description: Change an agent's clearPolicy and/or docEditMode (see agentPrefs). Privileged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: setAgentPrefs
        id:
          type: integer
        clearPolicy:
          $ref: '#/components/schemas/AgentClearPolicy'
        docEditMode:
          $ref: '#/components/schemas/DocEditMode'

    LoadAgentModels:
      description: Read the agent's model picker (see agentModels). Privileged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: loadAgentModels
        id:
          type: integer

    ListSlashCommands:
      description: Ask for the agent's slash commands (see slashCommands). Privileged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: listSlashCommands
        id:
          type: integer

    ListPastSessions:
      description: List a folder's earlier sessions (see pastSessions). Privileged.
      type: object
      additionalProperties: false
      required: [type, cwd]
      properties:
        type:
          const: listPastSessions
        cwd:
          type: string

    SetAgentModel:
      description: |
        Switch the agent to the option with this label in its model picker, for
        this session only. Waits for the agent's turn to end. Privileged.
      type: object
      additionalProperties: false
      required: [type, id, label]
      properties:
        type:
          const: setAgentModel
        id:
          type: integer
        label:
          type: string

    SetDocEditDefault:
      description: The office-wide default for agents' document edits (see docEditDefault). Privileged; persisted.
      type: object
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          const: setDocEditDefault
        mode:
          $ref: '#/components/schemas/DocEditMode'

    UndoDocEdit:
      description: Put a document back as it was before an edit — only while nobody changed it since. Privileged.
      type: object
      additionalProperties: false
      required: [type, editId]
      properties:
        type:
          const: undoDocEdit
        editId:
          type: string

    OpenOfficeFile:
      description: |
        Open a document from this computer by path: it joins Files → Recent
        (not the whiteboard) and the reply (fileOpened) names the id the
        viewer fetches it by. Privileged.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: openOfficeFile
        path:
          type: string

    ForgetOfficeFile:
      description: Remove a file from Files → Recent. The file itself is not touched. Privileged.
      type: object
      additionalProperties: false
      required: [type, fileId]
      properties:
        type:
          const: forgetOfficeFile
        fileId:
          type: string

    PinOfficeFile:
      description: Pin a file to the whiteboard (agents see it) or remove its pins. Privileged.
      type: object
      additionalProperties: false
      required: [type, fileId, pinned]
      properties:
        type:
          const: pinOfficeFile
        fileId:
          type: string
        pinned:
          type: boolean

    DeleteOfficeUpload:
      description: |
        Delete the office's stored copy of an uploaded file (and its pins),
        and drop it from Files. Only copies in ~/.pixel-agents/files; the
        user's own files are never deleted. Privileged.
      type: object
      additionalProperties: false
      required: [type, fileId]
      properties:
        type:
          const: deleteOfficeUpload
        fileId:
          type: string

    ClearBackups:
      description: Delete the backups of one file (`key` from filesLoaded.backups), or all. Privileged.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: clearBackups
        key:
          type: string

    InterruptAgent:
      description: |
        Stop what an agent is doing: press Esc in its terminal, Claude's own
        interrupt. Only while the agent is mid-turn or showing a permission
        prompt (an Esc at an idle prompt opens Claude's rewind menu). Reaches
        the same terminals office chat does (agentChatSendable). Privileged.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: interruptAgent
        id:
          type: integer

    AnswerScreenQuestion:
      description: |
        Pick an option of the question on an office-run agent's screen. The
        server moves the cursor to it and presses Enter, only if the screen
        still shows the question named by `key`. Privileged.
      type: object
      additionalProperties: false
      required: [type, id, key, option]
      properties:
        type:
          const: answerScreenQuestion
        id:
          type: integer
        key:
          type: string
        option:
          type: integer

    AnswerPermission:
      description: |
        Answer an agentPermissionAsk. `terminal` stops waiting and lets the
        prompt show in the agent's own terminal. Privileged.
      type: object
      additionalProperties: false
      required: [type, id, requestId, decision]
      properties:
        type:
          const: answerPermission
        id:
          type: integer
        requestId:
          type: string
        decision:
          $ref: '#/components/schemas/PermissionDecision'

    ListFolder:
      description: |
        List the sub-folders of a folder (home when `path` is absent), for the
        folder picker. With `files`, also the files the document viewer can
        open (Open file). Privileged.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: listFolder
        path:
          type: string
        files:
          type: boolean

    PickFolder:
      description: |
        Open this machine's own folder dialog and reply with `folderPicked`.
        The dialog appears where the office RUNS, so clients only offer it
        when `officeCapabilities.canPickFolder` says one is available.
        Privileged: it reveals and hands back a path on this machine.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: pickFolder

    # ── Supporting schemas ─────────────────────────────────────────

    PermissionDecision:
      type: string
      enum: [allow, deny, terminal]

    FolderEntry:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
        isProject:
          type: boolean
          description: Looks like a project (has .git or package.json etc.).

    FolderFile:
      type: object
      additionalProperties: false
      required: [name, path, size]
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        modifiedAt:
          type: string

    AgentKey:
      type: string
      enum: [enter, escape, up, down, tab, '1', '2', '3', y, n]

    ChatEntry:
      type: object
      additionalProperties: false
      required: [entryId, role, text]
      properties:
        entryId:
          type: string
          description: Stable id (transcript uuid, or the tool_use id for tool rows).
        role:
          $ref: '#/components/schemas/ChatRole'
        text:
          type: string
          description: Message text, or the formatted tool status for tool rows.
        source:
          $ref: '#/components/schemas/ChatSource'
        toolDone:
          type: boolean
        usage:
          $ref: '#/components/schemas/TokenUsage'
        timestamp:
          type: string
          description: ISO 8601 time from the transcript record.
        edit:
          $ref: '#/components/schemas/ChatEdit'

    ChatEdit:
      description: |
        What a file-editing tool row changes, from the tool call's own input
        (the provider decides which tools edit files). `write` replaces or
        creates the whole file, so its one hunk has only `added`. Each side is
        clipped for the wire; `clipped` says so.
      type: object
      additionalProperties: false
      required: [path, kind, hunks]
      properties:
        path:
          type: string
        kind:
          $ref: '#/components/schemas/ChatEditKind'
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/ChatEditHunk'
        clipped:
          type: boolean

    ChatEditKind:
      type: string
      enum: [edit, write]

    ChatEditHunk:
      type: object
      additionalProperties: false
      required: [removed, added]
      properties:
        removed:
          type: string
        added:
          type: string

    TokenUsage:
      description: One request's token counts, as the transcript reports them.
      type: object
      additionalProperties: false
      required: [input, output, cacheRead, cacheCreation]
      properties:
        input:
          type: integer
        output:
          type: integer
        cacheRead:
          type: integer
        cacheCreation:
          type: integer

    ChatRole:
      type: string
      enum: [user, assistant, tool]

    ChatSource:
      description: Where a user prompt was typed.
      type: string
      enum: [terminal, office]

    QueuedChatMessage:
      type: object
      additionalProperties: false
      required: [queueId, text]
      properties:
        queueId:
          type: string
        text:
          type: string

    BoardPin:
      type: object
      additionalProperties: false
      required: [id, kind, title, value, scope, createdAt]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/BoardPinKind'
        title:
          type: string
        value:
          type: string
          description: URL for a link, path for a file, code for a snippet, text for a note.
        detail:
          type: string
          description: |
            Optional notes about the pin - what it is, why it matters, how to
            use it. Sent along when the pin is attached to a message.
        scope:
          type: array
          description: Agent ids the pin is meant for. Empty = every session.
          items:
            type: integer
        createdAt:
          type: string

    DeskTask:
      description: One card on the task desk.
      type: object
      additionalProperties: false
      required:
        [id, num, kind, title, body, priority, folder, allow, state, round, briefs, log, createdAt]
      properties:
        id:
          type: string
        num:
          type: integer
          description: Short number people and agents use to name the card (#12).
        kind:
          $ref: '#/components/schemas/DeskTaskKind'
        title:
          type: string
        body:
          type: string
        priority:
          $ref: '#/components/schemas/DeskTaskPriority'
        folder:
          $ref: '#/components/schemas/DeskFolder'
        allow:
          type: array
          description: Agent ids that may take the card. Empty = any agent in the folder.
          items:
            type: integer
        state:
          $ref: '#/components/schemas/DeskTaskState'
        round:
          type: integer
          description: 1, plus one for every rejected brief.
        claimedBy:
          type: integer
          description: Agent id looking at or building the card.
        owner:
          type: string
          description: |
            The office process that made the claim. Agent ids are only
            meaningful inside one process, and two may share this file (VS Code
            and standalone), so each leaves the other's claims alone.
        queued:
          type: boolean
          description: The human said "do the task"; it starts when an agent is free.
        attempts:
          type: integer
          description: Looks that ended without a brief, this round.
        briefs:
          type: array
          description: Oldest first. The last one is current.
          items:
            $ref: '#/components/schemas/DeskBrief'
        result:
          $ref: '#/components/schemas/DeskResult'
        log:
          type: array
          items:
            $ref: '#/components/schemas/DeskLogEntry'
        createdAt:
          type: string
        teamId:
          type: string
          description: |
            A team preset the card is for. The desk starts the team in the
            card's folder and hands the card to its lead only; the lead calls
            teammates in. Standalone office only.
        crewId:
          type: string
          description: The started team (teamRuns) working the card, while this office runs it.
        workflowId:
          type: string
          description: A saved workflow whose steps the looking agent uses as the brief's steps.
        model:
          type: string
          description: Model (picker label) an agent started for this card uses — chosen by the human or suggested by Laya.
        autoRouted:
          type: boolean
          description: Autopilot has chosen this card's team / workflow / model (once; the human can still change them).
        column:
          type: string
          description: The board column (deskFlow) the card sits in inside its state; absent = the state's own column.
        attachments:
          type: array
          description: Files the human attached. Agents get their paths, never their content.
          items:
            $ref: '#/components/schemas/DeskAttachment'
        waitingOn:
          $ref: '#/components/schemas/DeskWaitingOn'

    DeskWaitingOn:
      description: |
        A build turn ended without a report and a decision model read the
        agent's last reply as a question for the human, or as stuck. The card
        stays with the agent (state working) and shows under Needs you until
        the agent works again. Only set while the card is working.
      type: object
      additionalProperties: false
      required: [kind, text, at]
      properties:
        kind:
          $ref: '#/components/schemas/DeskWaitingKind'
        text:
          type: string
          description: The end of the agent's last reply.
        at:
          type: string

    DeskWaitingKind:
      type: string
      enum: [question, blocked]

    DeskAttachment:
      type: object
      additionalProperties: false
      required: [path, name]
      properties:
        path:
          type: string
          description: Absolute path on the server's machine.
        name:
          type: string

    DeskFolder:
      description: |
        Where a card's work happens. `root` is what agents are matched on: the
        git top-level folder, or the folder itself outside a git project.
      type: object
      additionalProperties: false
      required: [root, name, isGit]
      properties:
        root:
          type: string
        name:
          type: string
        isGit:
          type: boolean
        branch:
          type: string
        subPath:
          type: string
          description: Folder inside the project the human pointed at. A hint for the agent only.

    DeskBrief:
      description: What an agent understood a card to want. Its subtasks belong to this one card.
      type: object
      additionalProperties: false
      required: [by, understanding, subtasks, files, questions, risk, size, createdAt]
      properties:
        by:
          type: string
          description: The agent's label when it wrote the brief (ids do not survive restarts).
        understanding:
          type: string
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/DeskSubtask'
        files:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/DeskQuestion'
        risk:
          type: string
        size:
          type: string
        createdAt:
          type: string

    DeskSubtask:
      description: |
        One step of a card's plan. `kind` works like a workflow step: `do` is
        work, `gate` waits for the human's go-ahead (`pixel-office task gate`),
        `show` points the human at a file (`pixel-office show`, then `task step`).
        Absent = do. `id` stays with the step when the human reorders the list.
      type: object
      additionalProperties: false
      required: [title, skip, done, by]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/WorkflowStepKind'
        title:
          type: string
        ref:
          type: string
          description: A file (and place) the step is about, e.g. "src/app.ts --lines 10-40".
        waiting:
          type: boolean
          description: A gate step the building agent reached; it waits for answerDeskGate.
        ask:
          type: string
          description: What the agent asked at the gate, if anything.
        skip:
          type: boolean
        done:
          type: boolean
        by:
          $ref: '#/components/schemas/DeskSubtaskAuthor'

    DeskSubtaskAuthor:
      type: string
      enum: [agent, you]

    DeskQuestion:
      type: object
      additionalProperties: false
      required: [q, a]
      properties:
        q:
          type: string
        a:
          type: string

    DeskResult:
      type: object
      additionalProperties: false
      required: [by, summary]
      properties:
        by:
          type: string
        summary:
          type: string
        branch:
          type: string
        diffStat:
          type: string
        tests:
          type: string

    DeskLogEntry:
      type: object
      additionalProperties: false
      required: [at, who, kind, text]
      properties:
        at:
          type: string
        who:
          type: string
        kind:
          $ref: '#/components/schemas/DeskLogKind'
        text:
          type: string

    DeskLogKind:
      type: string
      enum: [agent, verified, rejected, system]

    DeskTaskKind:
      type: string
      enum: [task, issue, feature]

    DeskTaskPriority:
      type: string
      enum: [p1, p2]

    DeskTaskState:
      type: string
      enum: [draft, inbox, looking, brief, ready, working, result, done]

    DeskHumanAction:
      type: string
      enum: [publish, verified, do, rejected, accept, sendBack]

    DeskAgent:
      description: What the task desk knows about one agent.
      type: object
      additionalProperties: false
      required: [id, pickup, canReach]
      properties:
        id:
          type: integer
        root:
          type: string
          description: Same meaning as DeskFolder.root. Absent until the agent's folder is known.
        branch:
          type: string
        pickup:
          type: boolean
        canReach:
          type: boolean
          description: The office can type into this agent's terminal, so it can be handed a card.

    BoardPinKind:
      type: string
      enum: [link, file, snippet, note]

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
