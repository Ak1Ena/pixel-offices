# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Session chat
        - $ref: '#/components/schemas/AgentChatEntry'
        - $ref: '#/components/schemas/AgentChatHistory'
        - $ref: '#/components/schemas/AgentChatQueue'
        - $ref: '#/components/schemas/AgentChatSendable'
        # Token usage + naming
        - $ref: '#/components/schemas/AgentTokenUsage'
        - $ref: '#/components/schemas/AgentRenamed'
        - $ref: '#/components/schemas/AgentLookChanged'
        # Agents the office runs itself
        - $ref: '#/components/schemas/OfficeCapabilities'
        - $ref: '#/components/schemas/AgentScreen'
        - $ref: '#/components/schemas/StartAgentResult'
        - $ref: '#/components/schemas/AgentRelayState'
        - $ref: '#/components/schemas/AgentPrefs'
        - $ref: '#/components/schemas/AgentModels'
        - $ref: '#/components/schemas/ModelOptions'
        - $ref: '#/components/schemas/SlashCommands'
        - $ref: '#/components/schemas/PastSessions'
        - $ref: '#/components/schemas/AgentClearRequests'
        - $ref: '#/components/schemas/DocEdits'
        - $ref: '#/components/schemas/DocEditDefault'
        - $ref: '#/components/schemas/LayaStatus'
        - $ref: '#/components/schemas/DeskCardSuggestion'
        - $ref: '#/components/schemas/AutopilotState'
        - $ref: '#/components/schemas/LayaConsult'
        - $ref: '#/components/schemas/DeskFlowLoaded'
        - $ref: '#/components/schemas/FilesLoaded'
        - $ref: '#/components/schemas/FileOpened'
        - $ref: '#/components/schemas/AgentPermissionAsk'
        - $ref: '#/components/schemas/AgentPermissionAnswered'
        - $ref: '#/components/schemas/FolderListing'
        - $ref: '#/components/schemas/FolderPicked'
        # Whiteboard
        - $ref: '#/components/schemas/BoardLoaded'
        - $ref: '#/components/schemas/FocusRequests'
        - $ref: '#/components/schemas/WorkflowsLoaded'
        - $ref: '#/components/schemas/WorkflowRuns'
        - $ref: '#/components/schemas/WorkflowNotice'
        - $ref: '#/components/schemas/TeamsLoaded'
        - $ref: '#/components/schemas/TeamRuns'
        - $ref: '#/components/schemas/TeamNotice'
        - $ref: '#/components/schemas/TeamDraft'
        - $ref: '#/components/schemas/WorkflowDraft'
        - $ref: '#/components/schemas/Proposals'
        # Task desk
        - $ref: '#/components/schemas/TaskDeskLoaded'
        - $ref: '#/components/schemas/TaskDeskNotice'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/RequestDiagnostics'
        - $ref: '#/components/schemas/SendChatMessage'
        - $ref: '#/components/schemas/CancelChatMessage'
        - $ref: '#/components/schemas/SaveBoardPin'
        - $ref: '#/components/schemas/RemoveBoardPin'
        - $ref: '#/components/schemas/AnswerFocus'
        - $ref: '#/components/schemas/SaveWorkflow'
        - $ref: '#/components/schemas/DeleteWorkflow'
        - $ref: '#/components/schemas/AttachWorkflow'
        - $ref: '#/components/schemas/AnswerGate'
        - $ref: '#/components/schemas/StopWorkflowRun'
        - $ref: '#/components/schemas/ImportWorkflow'
        - $ref: '#/components/schemas/SaveTeam'
        - $ref: '#/components/schemas/DeleteTeam'
        - $ref: '#/components/schemas/StartTeam'
        - $ref: '#/components/schemas/StopTeam'
        - $ref: '#/components/schemas/ImportTeam'
        - $ref: '#/components/schemas/DraftTeam'
        - $ref: '#/components/schemas/DraftWorkflow'
        - $ref: '#/components/schemas/DecideHunk'
        - $ref: '#/components/schemas/ApplyProposal'
        - $ref: '#/components/schemas/DiscardProposal'
        - $ref: '#/components/schemas/UndoProposal'
        # Task desk
        - $ref: '#/components/schemas/SaveDeskTask'
        - $ref: '#/components/schemas/RemoveDeskTask'
        - $ref: '#/components/schemas/DeskTaskAction'
        - $ref: '#/components/schemas/EditDeskSteps'
        - $ref: '#/components/schemas/AnswerDeskGate'
        - $ref: '#/components/schemas/SetDeskTaskAllow'
        - $ref: '#/components/schemas/SetAgentPickup'
        - $ref: '#/components/schemas/RenameAgent'
        - $ref: '#/components/schemas/SetAgentLook'
        - $ref: '#/components/schemas/StartAgent'
        - $ref: '#/components/schemas/SendAgentKeys'
        - $ref: '#/components/schemas/InterruptAgent'
        - $ref: '#/components/schemas/ClearAgentContext'
        - $ref: '#/components/schemas/AnswerClearRequest'
        - $ref: '#/components/schemas/SetAgentPrefs'
        - $ref: '#/components/schemas/LoadAgentModels'
        - $ref: '#/components/schemas/SetAgentModel'
        - $ref: '#/components/schemas/ListSlashCommands'
        - $ref: '#/components/schemas/ListPastSessions'
        - $ref: '#/components/schemas/SetDocEditDefault'
        - $ref: '#/components/schemas/UndoDocEdit'
        - $ref: '#/components/schemas/SetLayaEnabled'
        - $ref: '#/components/schemas/SetLayaModel'
        - $ref: '#/components/schemas/UninstallLaya'
        - $ref: '#/components/schemas/SuggestDeskCard'
        - $ref: '#/components/schemas/SetAutopilot'
        - $ref: '#/components/schemas/SaveDeskFlow'
        - $ref: '#/components/schemas/SetDeskColumn'
        - $ref: '#/components/schemas/OpenOfficeFile'
        - $ref: '#/components/schemas/ForgetOfficeFile'
        - $ref: '#/components/schemas/PinOfficeFile'
        - $ref: '#/components/schemas/DeleteOfficeUpload'
        - $ref: '#/components/schemas/ClearBackups'
        - $ref: '#/components/schemas/AnswerScreenQuestion'
        - $ref: '#/components/schemas/SetAgentRelay'
        - $ref: '#/components/schemas/AnswerPermission'
        - $ref: '#/components/schemas/ListFolder'
        - $ref: '#/components/schemas/PickFolder'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").
        seeded:
          type: boolean
          description: >-
            The state was read from the transcript when the agent was adopted
            or restored (it was already at its prompt), not a turn that just
            ended: the client shows it idle with no bubble and no sound.

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    AgentChatEntry:
      description: |
        One entry of an agent's session chat, read from its transcript: a user
        prompt, an assistant reply, or a tool row. Upsert semantics — an entry
        re-sent with the same `entryId` replaces the earlier one (a tool row is
        re-sent with `toolDone: true` when its result lands).
      type: object
      additionalProperties: false
      required: [type, id, entry]
      properties:
        type:
          const: agentChatEntry
        id:
          type: integer
        entry:
          $ref: '#/components/schemas/ChatEntry'

    AgentChatHistory:
      description: |
        The recent chat of one agent, oldest first. Sent during the
        `webviewReady` handshake and when a mid-session agent is first watched.
        Replaces whatever the client held for that agent.
      type: object
      additionalProperties: false
      required: [type, id, entries]
      properties:
        type:
          const: agentChatHistory
        id:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChatEntry'

    AgentChatQueue:
      description: |
        Messages sent from the office that are waiting for the agent's turn to
        end before they are typed into its terminal. Sent whenever the queue
        changes; an empty list means nothing is pending. `error` reports why the
        latest send could not be delivered (no terminal, not permitted).
      type: object
      additionalProperties: false
      required: [type, id, queued]
      properties:
        type:
          const: agentChatQueue
        id:
          type: integer
        queued:
          type: array
          items:
            $ref: '#/components/schemas/QueuedChatMessage'
        error:
          type: string

    AgentChatSendable:
      description: |
        Whether the office can type into this agent's terminal: one the VS Code
        extension owns, or a session started with `pixel-agents claude`. Sent
        when it changes and, for sendable agents, during the handshake. Absent
        means not sendable — the chat card is read-only.
      type: object
      additionalProperties: false
      required: [type, id, sendable]
      properties:
        type:
          const: agentChatSendable
        id:
          type: integer
        sendable:
          type: boolean

    AgentTokenUsage:
      description: |
        How many tokens an agent's session has used, from its transcript's
        per-request `usage` (each request counted once, however many records it
        spans). `burnPerMinute` counts NEW tokens (input + cache writes +
        output; cache reads excluded) over the last few minutes and decays to 0
        when the agent goes quiet — it drives the "on fire" effect.
        `partial` is true when the transcript was too large to total from the
        start, so the totals cover only what has been read.
      type: object
      additionalProperties: false
      required: [type, id, totalTokens, outputTokens, requests, burnPerMinute]
      properties:
        type:
          const: agentTokenUsage
        id:
          type: integer
        totalTokens:
          type: integer
          description: Sum over requests of input + cache writes + cache reads + output.
        outputTokens:
          type: integer
        cacheReadTokens:
          type: integer
          description: |
            The cache-read part of totalTokens. Every request re-reads the whole
            cached context, so this dwarfs the rest; the office shows
            totalTokens minus this as the session's tokens (what burnPerMinute counts).
        requests:
          type: integer
        burnPerMinute:
          type: integer
        partial:
          type: boolean

    AgentLook:
      description: |
        A character's look in the 3D office. The server rebuilds it from known
        values (core/src/agentLook.ts) before storing or sending it.
      type: object
      additionalProperties: false
      required: [hair, top, height, extras, skin, hairColor, shirt, pants]
      properties:
        hair:
          $ref: '#/components/schemas/LookHair'
        top:
          $ref: '#/components/schemas/LookTop'
        height:
          $ref: '#/components/schemas/LookHeight'
        extras:
          type: array
          items:
            $ref: '#/components/schemas/LookExtra'
        skin:
          type: string
        hairColor:
          type: string
        shirt:
          type: string
        pants:
          type: string

    LookHair:
      type: string
      enum: [short, bob, long, bun, spiky, curly, bald]

    LookTop:
      type: string
      enum: [tee, hoodie, tie]

    LookHeight:
      type: string
      enum: [short, average, tall]

    LookExtra:
      type: string
      enum: [glasses, headphones, cap, beanie, beard]

    AgentLookChanged:
      description: |
        An agent's 3D look changed (setAgentLook, or a look chosen when the
        office started it). No `look` = cleared. Persisted with the agent and
        sent during the handshake.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentLook
        id:
          type: integer
        look:
          $ref: '#/components/schemas/AgentLook'

    AgentRenamed:
      description: |
        A user-given name for an agent's character (renameAgent). An empty
        name clears it, and the character goes back to its default label.
        Persisted with the agent and sent during the handshake.
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          const: agentRenamed
        id:
          type: integer
        name:
          type: string

    OfficeCapabilities:
      description: |
        What this office can do beyond watching. `canStartAgents` is true when
        the server can run Claude itself (standalone with node-pty); the
        client then offers + Agent. Sent during the handshake.
      type: object
      additionalProperties: false
      required: [type, canStartAgents, recentFolders]
      properties:
        type:
          const: officeCapabilities
        canStartAgents:
          type: boolean
        privileged:
          type: boolean
          description: |
            True when this connection may do privileged things (type into
            sessions, answer permission prompts, toggle the relay, browse folders).
        canPickFolder:
          type: boolean
          description: |
            True when this connection may open the machine's own folder dialog
            (`pickFolder`): privileged, and a native dialog is available here.
        recentFolders:
          type: array
          items:
            type: string

    AgentScreen:
      description: |
        The visible terminal screen of an agent the office runs itself, as
        plain text lines (no colors). Such an agent has no terminal window, so
        this is how its on-screen questions (trust this folder, permission
        prompts) are seen and answered (sendAgentKeys). Sent when it changes,
        at most about once a second. `question` is set while the screen shows
        a numbered choice, so the office can show it as a dialog and answer
        it with answerScreenQuestion.
      type: object
      additionalProperties: false
      required: [type, id, lines]
      properties:
        type:
          const: agentScreen
        id:
          type: integer
        lines:
          type: array
          items:
            type: string
        question:
          $ref: '#/components/schemas/ScreenQuestion'

    ScreenQuestion:
      description: |
        A numbered choice read off an office-run agent's screen. `key` names
        this exact question; an answer carrying a different key is refused, so
        a click can never land on a question that replaced it.
      type: object
      additionalProperties: false
      required: [key, prompt, options]
      properties:
        key:
          type: string
        prompt:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ScreenQuestionOption'

    ScreenQuestionOption:
      type: object
      additionalProperties: false
      required: [number, label]
      properties:
        number:
          type: integer
        label:
          type: string

    StartAgentResult:
      description: Reply to startAgent, sent only to the requesting client.
      type: object
      additionalProperties: false
      required: [type, ok]
      properties:
        type:
          const: startAgentResult
        ok:
          type: boolean
        error:
          type: string

    AgentPrefs:
      description: |
        Per-agent settings the human picks: what happens when the agent asks to
        clear its own context, and whether its document edits wait for review
        (absent = the office default). Persisted with the agent; sent in the
        handshake and when they change.
      type: object
      additionalProperties: false
      required: [type, id, clearPolicy]
      properties:
        type:
          const: agentPrefs
        id:
          type: integer
        clearPolicy:
          $ref: '#/components/schemas/AgentClearPolicy'
        docEditMode:
          $ref: '#/components/schemas/DocEditMode'

    AgentClearPolicy:
      type: string
      enum: [ask, allow, never]

    AgentModels:
      description: |
        The models an agent can switch to, as its own CLI lists them: the
        server opens the provider's model picker (Claude: `/model`) on the
        agent's screen, reads the options, and closes it again. Never a
        hard-coded list. Only agents the office runs have a screen to read.
        `state` is `loading` while the picker is being read and `switching`
        while a choice is being made; `error` says why the last try failed.
      type: object
      additionalProperties: false
      required: [type, id, options, state]
      properties:
        type:
          const: agentModels
        id:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/ModelOption'
        state:
          $ref: '#/components/schemas/AgentModelsState'
        error:
          type: string

    AgentModelsState:
      type: string
      enum: [idle, loading, switching]

    ModelOptions:
      description: |
        The last model list a provider's picker showed, for start forms (+ Agent,
        the task desk): what a NEW agent of that provider can be started on.
        Sent in the handshake and whenever a picker is read.
      type: object
      additionalProperties: false
      required: [type, providerId, options]
      properties:
        type:
          const: modelOptions
        providerId:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ModelOption'

    SlashCommands:
      description: |
        The slash commands an agent's CLI accepts in its folder, as the CLI
        reports them (Claude: a headless run's init message). Names without
        the leading `/`. Sent only to the client that asked (listSlashCommands).
      type: object
      additionalProperties: false
      required: [type, id, commands]
      properties:
        type:
          const: slashCommands
        id:
          type: integer
        commands:
          type: array
          items:
            type: string
        error:
          type: string

    PastSessions:
      description: |
        A folder's earlier Claude sessions, newest first, for + Agent → Resume.
        Sent only to the client that asked (listPastSessions).
      type: object
      additionalProperties: false
      required: [type, cwd, sessions]
      properties:
        type:
          const: pastSessions
        cwd:
          type: string
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/PastSession'
        error:
          type: string

    PastSession:
      type: object
      additionalProperties: false
      required: [sessionId, title, updatedAt]
      properties:
        sessionId:
          type: string
        title:
          type: string
          description: The name the user gave it, else Claude's own title, else its first prompt.
        firstPrompt:
          type: string
        updatedAt:
          type: string
        open:
          type: boolean
          description: An agent in this office is this session right now.

    ModelOption:
      description: One entry of a provider's model picker, as it was shown.
      type: object
      additionalProperties: false
      required: [number, label]
      properties:
        number:
          type: integer
          description: Its position in the picker (1-based).
        label:
          type: string
          description: The option's name column, e.g. "Sonnet". Choices are made by label.
        detail:
          type: string
          description: The rest of the line, e.g. "Sonnet 5 · Efficient for routine tasks".
        current:
          type: boolean
          description: The picker marks it as the one in use.

    SuggestDeskCard:
      description: |
        Ask the decision model (Laya) which team preset, workflow and model fit
        a card being written. Answered with deskCardSuggestion to the asker
        only; nothing is saved. Privileged.
      type: object
      additionalProperties: false
      required: [type, requestId, title]
      properties:
        type:
          const: suggestDeskCard
        requestId:
          type: string
        title:
          type: string
        body:
          type: string
        kind:
          type: string

    DeskCardSuggestionConfidence:
      type: object
      additionalProperties: false
      properties:
        team:
          type: number
        workflow:
          type: number
        model:
          type: number

    DeskCardSuggestion:
      description: |
        Laya's picks for a card (see suggestDeskCard). A field is present only
        when it was asked and answered confidently; an empty string means "no
        team" / "no workflow" / "keep the default model". `error` when no
        decision model is running or it could not answer.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: deskCardSuggestion
        requestId:
          type: string
        teamId:
          type: string
        workflowId:
          type: string
        model:
          type: string
          description: A model picker label, as startAgent takes it.
        confidence:
          $ref: '#/components/schemas/DeskCardSuggestionConfidence'
        error:
          type: string

    AutopilotState:
      description: |
        Settings → Autopilot: the desk routes new cards (team, workflow,
        model — by the decision model when one runs), starts briefs that need
        nobody, starts agents for cards nobody can take and closes its own
        idle ones. Handshake + on change.
      type: object
      additionalProperties: false
      required:
        [
          type,
          enabled,
          maxAgents,
          idleMinutes,
          command,
          agentAnswers,
          passGates,
          canStartAgents,
          running,
        ]
      properties:
        type:
          const: autopilotState
        enabled:
          type: boolean
        agentAnswers:
          description: Brief questions the decision model reads as safe are left to the agent to choose.
          type: boolean
        passGates:
          description: Gate steps the decision model reads as routine are passed without the human.
          type: boolean
        maxAgents:
          type: integer
        idleMinutes:
          type: integer
        command:
          type: string
        canStartAgents:
          description: This office can start agents (standalone with node-pty). Without it autopilot only routes and approves.
          type: boolean
        running:
          description: Agents autopilot started that are still open.
          type: integer

    DeskColumnDef:
      description: |
        A board column you define inside one card state (its `phase`): cards in
        that state sit in one of the state's columns. The description says what
        a card in it looks like — Laya reads it to move cards after each agent
        turn when `laya` is on. Moves between states stay with the desk's own
        rules; columns only split a state.
      type: object
      additionalProperties: false
      required: [id, name, description, phase, laya]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        phase:
          $ref: '#/components/schemas/DeskTaskState'
        laya:
          type: boolean

    DeskFlowLoaded:
      description: The board's columns (~/.pixel-agents/desk-flow.json). Handshake + on change.
      type: object
      additionalProperties: false
      required: [type, columns]
      properties:
        type:
          const: deskFlowLoaded
        columns:
          type: array
          items:
            $ref: '#/components/schemas/DeskColumnDef'

    SaveDeskFlow:
      description: Replace the board's columns. Privileged.
      type: object
      additionalProperties: false
      required: [type, columns]
      properties:
        type:
          const: saveDeskFlow
        columns:
          type: array
          items:
            $ref: '#/components/schemas/DeskColumnDef'

    SetDeskColumn:
      description: Move a card to another column of its current state ('' = the state's own column). Privileged.
      type: object
      additionalProperties: false
      required: [type, taskId, column]
      properties:
        type:
          const: setDeskColumn
        taskId:
          type: string
        column:
          type: string

    LayaConsult:
      description: |
        The decision model (Laya) is being asked about this agent — the office
        shows it walking over to Laya with `topic`. Throttled per agent.
      type: object
      additionalProperties: false
      required: [type, id, topic]
      properties:
        type:
          const: layaConsult
        id:
          type: integer
        topic:
          type: string

    SetAutopilot:
      description: Change Settings → Autopilot; omitted fields keep their value. Privileged; persisted in config.json.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setAutopilot
        enabled:
          type: boolean
        agentAnswers:
          type: boolean
        passGates:
          type: boolean
        maxAgents:
          type: integer
        idleMinutes:
          type: integer
        command:
          type: string

    LayaModel:
      description: Laya checkpoint choice — English only, multilingual (100+ languages), or auto (both loaded; Laya's router picks per reply).
      type: string
      enum: [english, multilingual, auto]

    LayaState:
      type: string
      enum: [absent, installing, stopped, starting, running, uninstalling, error]

    LayaStatus:
      description: |
        The office's own Laya decision model (Settings → Decision model):
        whether it is downloaded and running. Handshake + on change.
      type: object
      additionalProperties: false
      required: [type, state, enabled, model]
      properties:
        type:
          const: layaStatus
        state:
          $ref: '#/components/schemas/LayaState'
        enabled:
          type: boolean
        model:
          $ref: '#/components/schemas/LayaModel'
        detail:
          type: string
        error:
          type: string
        external:
          description: A hand-configured decision endpoint in use instead of the office's own Laya.
          type: string

    SetLayaEnabled:
      description: Turn the office's own Laya on (downloads it into ~/.pixel-agents/laya the first time) or off (stops it; the download stays). Privileged; persisted.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setLayaEnabled
        enabled:
          type: boolean

    SetLayaModel:
      description: Pick Laya's language checkpoint(s); a running Laya restarts with them. Privileged; persisted.
      type: object
      additionalProperties: false
      required: [type, model]
      properties:
        type:
          const: setLayaModel
        model:
          $ref: '#/components/schemas/LayaModel'

    UninstallLaya:
      description: Stop the office's Laya and delete ~/.pixel-agents/laya (venv + downloaded models). Privileged.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: uninstallLaya

    DocEditMode:
      type: string
      enum: [ask, auto, 'off']

    AgentClearRequests:
      description: |
        Agents that asked to have their own context cleared (`pixel-office
        clear`) and are waiting for the human (clearPolicy `ask`). Always the
        whole list; sent in the handshake and on every change.
      type: object
      additionalProperties: false
      required: [type, requests]
      properties:
        type:
          const: agentClearRequests
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AgentClearRequest'

    AgentClearRequest:
      type: object
      additionalProperties: false
      required: [agentId, at]
      properties:
        agentId:
          type: integer
        reason:
          type: string
        at:
          type: string

    DocEdits:
      description: |
        Recent edits written to office documents (Word, PowerPoint, Excel,
        text) — by the human in the viewer, or by an agent whose document
        edits are auto-accepted. Newest last; always the whole list. Sent in
        the handshake and on every change. An agent's edits that wait for
        review are proposals instead.
      type: object
      additionalProperties: false
      required: [type, edits]
      properties:
        type:
          const: docEdits
        edits:
          type: array
          items:
            $ref: '#/components/schemas/DocEditNotice'

    DocEditNotice:
      type: object
      additionalProperties: false
      required: [editId, path, who, at, changes, canUndo, undone]
      properties:
        editId:
          type: string
        path:
          type: string
        who:
          type: string
        agentId:
          type: integer
        at:
          type: string
        changes:
          type: array
          description: 'One line per edit, e.g. "¶3: Churn in the … → Enterprise churn …".'
          items:
            type: string
        canUndo:
          type: boolean
        undone:
          type: boolean

    FilesLoaded:
      description: |
        Files → the documents the office opened (newest first), how much
        space its uploaded copies and backups take, and the backups by file.
        Separate from the whiteboard: opening a file never pins it. Sent in the
        handshake and on every change.
      type: object
      additionalProperties: false
      required: [type, files, uploadsBytes, backups, backupsBytes]
      properties:
        type:
          const: filesLoaded
        files:
          type: array
          items:
            $ref: '#/components/schemas/OfficeFile'
        uploadsBytes:
          type: integer
        backups:
          type: array
          items:
            $ref: '#/components/schemas/BackupGroup'
        backupsBytes:
          type: integer

    OfficeFile:
      type: object
      additionalProperties: false
      required: [fileId, path, name, source, openedAt, pinned]
      properties:
        fileId:
          type: string
        path:
          type: string
        name:
          type: string
        source:
          $ref: '#/components/schemas/OfficeFileSource'
        openedAt:
          type: string
        editedAt:
          type: string
        size:
          type: integer
        missing:
          type: boolean
          description: The file is no longer at its path.
        pinned:
          type: boolean
          description: A whiteboard pin points at it (agents can see it).

    OfficeFileSource:
      type: string
      enum: [disk, upload]

    BackupGroup:
      type: object
      additionalProperties: false
      required: [key, name, versions, bytes, newestAt]
      properties:
        key:
          type: string
        name:
          type: string
        versions:
          type: integer
        bytes:
          type: integer
        newestAt:
          type: string

    FileOpened:
      description: Reply to openOfficeFile, to the requester only — the file id to view, or why not.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: fileOpened
        path:
          type: string
        fileId:
          type: string
        error:
          type: string

    DocEditDefault:
      description: What an agent's document edits do when it has no docEditMode of its own. Handshake + on change.
      type: object
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          const: docEditDefault
        mode:
          $ref: '#/components/schemas/DocEditMode'

    AgentRelayState:
      description: |
        Whether agents may message each other: when on, an agent reply that
        mentions another agent as `@Name` is passed to that agent as a prompt
        (rate-limited). Off by default; not persisted. Sent in the handshake
        and when it changes.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: agentRelayState
        enabled:
          type: boolean

    AgentPermissionAsk:
      description: |
        An agent is waiting for a permission decision the office can give: its
        PermissionRequest hook is holding the prompt until someone answers
        (answerPermission) or the wait runs out, when the prompt falls back to
        the agent's own terminal. Sent when the ask opens and in the handshake.
      type: object
      additionalProperties: false
      required: [type, id, requestId, toolName]
      properties:
        type:
          const: agentPermissionAsk
        id:
          type: integer
        requestId:
          type: string
        toolName:
          type: string
        detail:
          type: string
          description: Short summary of what the tool wants to do (command, file path, URL).
        providerId:
          type: string
        expiresAt:
          type: integer
          description: Epoch ms when the wait runs out.

    AgentPermissionAnswered:
      description: A permission ask closed (answered here, elsewhere, or timed out).
      type: object
      additionalProperties: false
      required: [type, id, requestId]
      properties:
        type:
          const: agentPermissionAnswered
        id:
          type: integer
        requestId:
          type: string
        decision:
          $ref: '#/components/schemas/PermissionDecision'

    FolderListing:
      description: Reply to listFolder, sent only to the requesting client.
      type: object
      additionalProperties: false
      required: [type, path, entries]
      properties:
        type:
          const: folderListing
        path:
          type: string
          description: Absolute path that was listed.
        parent:
          type: string
          description: Parent folder, absent at the filesystem root.
        home:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FolderEntry'
        files:
          type: array
          description: Viewable files in the folder, when the request asked for them.
          items:
            $ref: '#/components/schemas/FolderFile'
        error:
          type: string

    FolderPicked:
      description: |
        Reply to pickFolder, sent only to the requesting client. `path` is the
        folder the human chose in their machine's own dialog; a cancel sends
        neither `path` nor `error` (nothing changes). `error` is set when the
        connection may not pick, or no dialog is available.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: folderPicked
        path:
          type: string
          description: Absolute path of the chosen folder.
        error:
          type: string

    BoardLoaded:
      description: |
        The whole shared whiteboard. Sent during the `webviewReady` handshake
        and to every client after any change (from this or another window).
      type: object
      additionalProperties: false
      required: [type, pins]
      properties:
        type:
          const: boardLoaded
        pins:
          type: array
          items:
            $ref: '#/components/schemas/BoardPin'

    TaskDeskLoaded:
      description: |
        The whole task desk: every card, and for every agent the folder it is
        working in and whether it picks up cards. Sent during the
        `webviewReady` handshake and to every client after any change (a card,
        an agent's folder, an agent coming or going).
      type: object
      additionalProperties: false
      required: [type, tasks, agents]
      properties:
        type:
          const: taskDeskLoaded
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DeskTask'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/DeskAgent'

    TaskDeskNotice:
      description: |
        Why a task desk request was refused (no such card, a note is required,
        the folder does not exist, not a privileged connection). Sent only to
        the requesting client.
      type: object
      additionalProperties: false
      required: [type, error]
      properties:
        type:
          const: taskDeskNotice
        error:
          type: string
        taskId:
          type: string

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Workspace-folder-to-Area mappings. Folder names map to one or more Area
        labels; new agents from that folder prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of folder name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist folder-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    SendChatMessage:
      description: |
        Type `text` into the agent's terminal as a prompt. Privileged: it drives
        a shell on the machine. Only agents the host owns a terminal for can
        receive it. By default the message is typed in at once, even mid-turn
        (Claude reads it when it can) — the current work carries on. With
        `interrupt`, the agent's current turn is stopped first (Esc) and the
        message is typed once that turn has ended. A permission prompt always
        holds messages (see `agentChatQueue`).
      type: object
      additionalProperties: false
      required: [type, id, text]
      properties:
        type:
          const: sendChatMessage
        id:
          type: integer
        text:
          type: string
        interrupt:
          type: boolean
          description: Stop the current turn first, then send ("Send now").

    CancelChatMessage:
      description: Drop a queued office message before it is typed in.
      type: object
      additionalProperties: false
      required: [type, id, queueId]
      properties:
        type:
          const: cancelChatMessage
        id:
          type: integer
        queueId:
          type: string

    FocusRequests:
      description: |
        Every open or recently answered "show me" request: an agent pointing
        the user at part of a file (`pixel-office show`). Sent on each change
        and in the handshake. Only the PATH travels — the viewer loads the file
        through its board pin (`pinId`), exactly like any file pin.
      type: object
      additionalProperties: false
      required: [type, requests]
      properties:
        type:
          const: focusRequests
        requests:
          type: array
          items:
            $ref: '#/components/schemas/FocusRequest'

    FocusRequest:
      type: object
      additionalProperties: false
      required: [requestId, pinId, path, state, createdAt]
      properties:
        requestId:
          type: string
        pinId:
          type: string
          description: The file pin the viewer opens.
        path:
          type: string
        agentId:
          type: integer
          description: The agent that asked, when the office could tell.
        why:
          type: string
        lineStart:
          type: integer
        lineEnd:
          type: integer
        page:
          type: integer
        cell:
          type: string
          description: A spreadsheet cell or range, e.g. "Q3!B4" or "B4:D6".
        state:
          $ref: '#/components/schemas/FocusState'
        reply:
          type: string
        createdAt:
          type: string

    FocusState:
      type: string
      enum: [waiting, seen]

    AnswerFocus:
      description: |
        Answer a "show me" request: without `reply` it is "Got it"; with one,
        the text goes back to an agent waiting on `pixel-office show --wait`.
        Privileged.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: answerFocus
        requestId:
          type: string
        reply:
          type: string

    WorkflowsLoaded:
      description: |
        Every saved workflow (~/.pixel-agents/workflows/*.md). Sent on each
        change, including edits made to the files outside the office.
      type: object
      additionalProperties: false
      required: [type, workflows]
      properties:
        type:
          const: workflowsLoaded
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'

    Workflow:
      type: object
      additionalProperties: false
      required: [id, title, steps]
      properties:
        id:
          type: string
          description: The file's name without .md; "" for a new workflow.
        title:
          type: string
        path:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'

    WorkflowStep:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          $ref: '#/components/schemas/WorkflowStepKind'
        text:
          type: string
        refs:
          type: array
          items:
            type: string
        show:
          type: string
          description: For a show step, the file (and spot flags) to show, e.g. "~/app/CHANGELOG.md --lines 1-40".

    WorkflowStepKind:
      type: string
      enum: [do, show, gate]

    WorkflowRuns:
      description: Every workflow run in this office, newest last. Sent on each change and in the handshake.
      type: object
      additionalProperties: false
      required: [type, runs]
      properties:
        type:
          const: workflowRuns
        runs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRun'

    WorkflowRun:
      type: object
      additionalProperties: false
      required: [runId, workflowId, title, agentId, steps, state, startedAt]
      properties:
        runId:
          type: string
        workflowId:
          type: string
        title:
          type: string
        agentId:
          type: integer
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunStep'
        state:
          $ref: '#/components/schemas/WorkflowRunState'
        startedAt:
          type: string
        endedAt:
          type: string

    WorkflowRunStep:
      type: object
      additionalProperties: false
      required: [kind, text, state]
      properties:
        kind:
          $ref: '#/components/schemas/WorkflowStepKind'
        text:
          type: string
        refs:
          type: array
          items:
            type: string
        state:
          $ref: '#/components/schemas/WorkflowRunStepState'

    WorkflowRunStepState:
      type: string
      enum: [pending, done, waiting, skipped]

    WorkflowRunState:
      type: string
      enum: [running, done, stopped, abandoned]

    WorkflowNotice:
      description: Why a workflow action was refused. Sent only to the client that asked.
      type: object
      additionalProperties: false
      required: [type, error]
      properties:
        type:
          const: workflowNotice
        error:
          type: string

    SaveWorkflow:
      description: Create a workflow (empty id) or replace the one with that id. Privileged.
      type: object
      additionalProperties: false
      required: [type, workflow]
      properties:
        type:
          const: saveWorkflow
        workflow:
          $ref: '#/components/schemas/Workflow'

    DeleteWorkflow:
      description: Delete a workflow file. Privileged.
      type: object
      additionalProperties: false
      required: [type, workflowId]
      properties:
        type:
          const: deleteWorkflow
        workflowId:
          type: string

    AttachWorkflow:
      description: |
        Give a workflow to an agent: a run starts and a short message naming the
        workflow's PATH is typed to the agent (never its steps). Privileged.
      type: object
      additionalProperties: false
      required: [type, id, workflowId]
      properties:
        type:
          const: attachWorkflow
        id:
          type: integer
        workflowId:
          type: string

    AnswerGate:
      description: Continue or stop a run waiting at a gate step. Privileged.
      type: object
      additionalProperties: false
      required: [type, runId, step, decision]
      properties:
        type:
          const: answerGate
        runId:
          type: string
        step:
          type: integer
        decision:
          $ref: '#/components/schemas/GateDecision'

    GateDecision:
      type: string
      enum: [continue, stop]

    StopWorkflowRun:
      description: Stop a run. Privileged.
      type: object
      additionalProperties: false
      required: [type, runId]
      properties:
        type:
          const: stopWorkflowRun
        runId:
          type: string

    TeamPreset:
