        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'

    TeamMember:
      type: object
      additionalProperties: false
      required: [name, role, instructions]
      properties:
        name:
          type: string
        role:
          type: string
        lead:
          type: boolean
        instructions:
          type: string
        command:
          type: string
          description: How to start it (claude, an alias, extra args). Empty means plain claude.
        palette:
          type: integer
          description: Character look (index into the office's characters).
        workflowId:
          type: string

    TeamsLoaded:
      description: Every saved team preset. Sent on each change and in the handshake.
      type: object
      additionalProperties: false
      required: [type, teams]
      properties:
        type:
          const: teamsLoaded
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamPreset'

    TeamRuns:
      description: Teams started from presets in this office. Sent on each change and in the handshake.
      type: object
      additionalProperties: false
      required: [type, runs]
      properties:
        type:
          const: teamRuns
        runs:
          type: array
          items:
            $ref: '#/components/schemas/TeamRun'

    TeamRun:
      type: object
      additionalProperties: false
      required: [crewId, teamId, title, goal, folder, members, startedAt, state]
      properties:
        crewId:
          type: string
        teamId:
          type: string
        title:
          type: string
        goal:
          type: string
        folder:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamRunMember'
        startedAt:
          type: string
        state:
          $ref: '#/components/schemas/TeamRunState'

    TeamRunMember:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
        lead:
          type: boolean
        palette:
          type: integer
        agentId:
          type: integer
          description: Set once the member's session is adopted.
        error:
          type: string
          description: Why this member did not start.
        benched:
          type: boolean
          description: Not started yet; the lead calls it in by writing @name in a reply.
        startedAt:
          type: string
          description: When the member's session was started (ISO time).

    TeamRunState:
      type: string
      enum: [running, stopped]

    TeamNotice:
      description: Why a team action was refused, or what happened. Sent only to the client that asked.
      type: object
      additionalProperties: false
      required: [type, message]
      properties:
        type:
          const: teamNotice
        message:
          type: string
        error:
          type: boolean

    TeamDraft:
      description: A team drafted by AI for the user to review. Nothing is saved until they save it.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: teamDraft
        requestId:
          type: string
        team:
