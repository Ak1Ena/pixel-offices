    ImportWorkflow:
      description: Save a workflow from markdown (an exported file). Privileged.
      type: object
      additionalProperties: false
      required: [type, markdown]
      properties:
        type:
          const: importWorkflow
        markdown:
          type: string

    SaveTeam:
      description: Create a team preset (empty id) or replace the one with that id. Privileged.
      type: object
      additionalProperties: false
      required: [type, team]
      properties:
        type:
          const: saveTeam
        team:
          $ref: '#/components/schemas/TeamPreset'

    DeleteTeam:
      description: Delete a team preset. Privileged.
      type: object
      additionalProperties: false
      required: [type, teamId]
      properties:
        type:
          const: deleteTeam
        teamId:
          type: string

    StartTeam:
      description: Start every member of a preset in `folder`; the lead is told `goal`. Privileged.
